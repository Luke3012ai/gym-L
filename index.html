<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Luca's Gym Program</title>
<style>
/* Layout: Apple Fitness–style single dark look. Summary rings on top, week of colour cards, full-screen workout player. */
:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --line:#38383a;
  --fg:#fff; --fg2:#98989f; --fg3:#636366;
  --move:#fa114f; --move-bg:#3b0716;
  --ex:#a6ff00; --ex-bg:#253806;
  --stand:#00e5f2; --stand-bg:#023a3e;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--stand);outline-offset:2px;border-radius:12px}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 110px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
h1{font-size:34px;line-height:1.1;margin:2px 0 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:18px;padding:16px}
.muted{color:var(--fg2)}
.small{font-size:13px}
.banner{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--fg2);display:flex;gap:10px;align-items:center}
.banner b{color:var(--fg)}
.banner .go{margin-left:auto;background:var(--ok);color:#000;font-weight:700;padding:8px 14px;border-radius:999px;flex:none}

/* rings */
.rings{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}
.rings svg{width:132px;height:132px;display:block}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.legend .k{font-size:15px;font-weight:600}
.legend .v{font-size:24px;font-weight:700;line-height:1.1}
.legend .v small{font-size:15px;font-weight:600;opacity:.85}
.c-move{color:var(--move)} .c-ex{color:var(--ex)} .c-stand{color:var(--stand)}

/* week strip */
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .arrow{width:38px;height:38px;border-radius:50%;background:var(--card);font-size:20px;display:grid;place-items:center;flex:none}
.weekbar .arrow:disabled{opacity:.3}
.weekbar .mid{flex:1;text-align:center;min-width:0}
.weekbar .mid b{display:block;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chip{background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.hl{background:var(--warn);color:#000}

/* workout cards */
.hero{position:relative;border-radius:22px;padding:18px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;text-align:left;width:100%}
.hero canvas{position:absolute;right:10px;top:4px;width:128px;height:128px}
.hero .t{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .n{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.hero .s{font-size:15px;font-weight:600;opacity:.9}
.hero .play{position:absolute;right:16px;bottom:16px;background:rgba(0,0,0,.35);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wc{position:relative;border-radius:18px;padding:12px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;text-align:left}
.wc canvas{position:absolute;right:2px;top:2px;width:86px;height:86px}
.wc .d{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.wc .n{font-size:19px;font-weight:800;line-height:1.1}
.wc .s{font-size:13px;font-weight:600;opacity:.85}
.wc .done{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;font-size:15px;font-weight:800}
.wc.rest{background:var(--card)}
.wc.rest .n{color:var(--fg)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--fg3);padding:4px}
.tabs button.on{color:var(--ex)}
.tabs svg{width:26px;height:26px}

/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .head{padding:16px 16px 22px;position:relative}
.sheet .head .x{position:absolute;right:14px;top:14px}
.xbtn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);font-size:18px;font-weight:700;display:grid;place-items:center}
.sheet .head .n{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:40px}
.sheet .body{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
.row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;background:var(--card);border-radius:16px}
.row canvas{width:64px;height:64px;background:var(--card2);border-radius:12px}
.row .rn{font-weight:700}
.row .rm{font-size:13px;color:var(--fg2)}
.row .rl{font-size:13px;color:var(--ex);margin-top:2px}
.grp{font-size:13px;font-weight:700;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 -6px}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;z-index:11}
.big{width:100%;max-width:528px;border-radius:16px;padding:16px;font-size:18px;font-weight:800;color:#000}
.ghost{background:var(--card2);color:var(--fg);border-radius:14px;padding:12px 16px;font-weight:700}

/* player */
.pl{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pl-top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.pl-top .xbtn{background:var(--card2)}
.pl-top .el{flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--ex)}
.pl-top .ct{width:34px;text-align:right;font-size:13px;color:var(--fg2)}
.prog{height:4px;margin:0 16px;background:var(--card2);border-radius:4px;overflow:hidden}
.prog div{height:100%;border-radius:4px;transition:width .3s}
.pl-body{flex:1;overflow-y:auto;padding-inline:16px;padding-block:10px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.pill{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;background:var(--card2)}
.stage{width:min(64vw,34vh,300px);aspect-ratio:1;max-width:100%;background:radial-gradient(circle at 50% 45%,#1d1d20,#0b0b0c 70%);border-radius:28px;position:relative}
.stage canvas{width:100%;height:100%;display:block}
.exn{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.exq{font-size:14px;color:var(--fg2);text-align:center;margin-top:2px}
.target{display:flex;align-items:baseline;gap:6px;justify-content:center}
.target .v{font-size:44px;font-weight:800;line-height:1}
.target .u{font-size:17px;font-weight:700;color:var(--fg2)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--card2)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stp{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stp .lab{font-size:12px;font-weight:700;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase}
.stp .ctl{display:flex;align-items:center;justify-content:space-between;width:100%}
.stp .ctl button{width:40px;height:40px;border-radius:50%;background:var(--card2);font-size:24px;font-weight:600;display:grid;place-items:center}
.stp .ctl .v{font-size:28px;font-weight:800}
.tip{width:100%;background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tip .last{color:var(--fg2)}
.tag{align-self:flex-start;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;color:#000}
.ringwrap{position:relative;width:min(62vw,30vh,250px);aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .mid .t{font-size:46px;font-weight:800;line-height:1}
.ringwrap .mid .l{font-size:14px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em}
.btnrow{display:flex;gap:10px;width:100%}
.btnrow>button{flex:1}
.notes{width:100%;display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.notes li{background:var(--card);border-radius:12px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center}
.notes li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ex);flex:none}
.next{width:100%;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px}
.next canvas{width:56px;height:56px;border-radius:10px;background:var(--card2)}
.pl-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:560px;width:100%;margin:0 auto}
.link{color:var(--fg2);font-size:15px;font-weight:600;padding:6px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:2}
.modal .box{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat .k{font-size:13px;font-weight:600;color:var(--fg2)}
.stat .v{font-size:28px;font-weight:800}

/* history & guide */
.hs{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.hs .top{display:flex;align-items:center;gap:10px}
.hs .dot{width:12px;height:12px;border-radius:50%;flex:none}
.hs .meta{display:flex;gap:14px;font-size:14px;color:var(--fg2);flex-wrap:wrap}
.hs .meta b{color:var(--fg);font-family:var(--round)}
.hs .det{font-size:14px;color:var(--fg2);display:flex;flex-direction:column;gap:2px;margin-top:4px;border-top:1px solid var(--line);padding-top:8px}
.tbl{overflow-x:auto;background:var(--card);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.rules{display:flex;flex-direction:column;gap:8px}
.rule{background:var(--card);border-radius:14px;padding:12px 14px}
.rule b{display:block;margin-bottom:2px}
.alert{background:#3a0b0b;border:1px solid #6b1a1a;border-radius:14px;padding:12px 14px;font-size:15px}
.empty{background:var(--card);border-radius:16px;padding:22px;text-align:center;color:var(--fg2)}
@media (max-width:380px){.rings{grid-template-columns:110px 1fr}.rings svg{width:110px;height:110px}.hero .n{font-size:26px}}
@media (prefers-reduced-motion:reduce){.prog div{transition:none}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
/* ---------------- program data ---------------- */
const START = new Date(2026, 9, 12); // Mon 12 Oct 2026
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const W = {
  UA:{id:'UA',name:'Upper A',sub:'Push focus',day:1,g:['#ff2d6f','#ff8a3d'],A:['chest_press','cs_row'],B:['db_shp','lat_pd'],C:['tri_pd','face_pull']},
  LA:{id:'LA',name:'Lower A',sub:'Legs · knee focus',day:2,g:['#2fd158','#0aa8a0'],A:['leg_press','leg_curl'],B:['goblet','pallof'],C:['calf','abduct']},
  Z2:{id:'Z2',name:'Zone 2',sub:'Cardio + core',day:3,g:['#2ad0ff','#3d5cff'],cardio:true},
  UB:{id:'UB',name:'Upper B',sub:'Pull focus',day:4,g:['#bf5af2','#ff375f'],A:['pulldown_n','incline_db'],B:['cable_row','lat_raise'],C:['curl','rear_fly']},
  LB:{id:'LB',name:'Lower B',sub:'Legs · hip focus',day:5,g:['#ffcc00','#ff7a00'],A:['hip_thrust','leg_ext'],B:['hinge','dead_bug'],C:['step_up','side_plank']}
};
const ORDER = ['UA','LA','Z2','UB','LB'];
const LIFTS = ['UA','LA','UB','LB'];
const EX = {
  chest_press:{n:'Chest press',eq:'Seated machine',cue:'Shoulder blades back and down. Breathe out as you push.',an:'chest_press',kg:2.5},
  cs_row:{n:'Chest-supported row',eq:'Machine or incline bench + dumbbells',cue:'Chest stays on the pad, so your back is unloaded.',an:'cs_row',kg:2.5},
  db_shp:{n:'Seated shoulder press',eq:'Dumbbells, back on the bench',cue:'Press slightly in front of your face. Don’t arch your back.',an:'db_shp',kg:1,lo:10,hi:12},
  lat_pd:{n:'Lat pulldown',eq:'Cable, wide bar',cue:'Pull your elbows to your ribs. No leaning back.',an:'lat_pd',kg:2.5,lo:10,hi:12},
  tri_pd:{n:'Triceps pushdown',eq:'Cable, rope',cue:'Elbows pinned to your sides.',an:'tri_pd',kg:2.5,lo:12,hi:15},
  face_pull:{n:'Face pull',eq:'Cable, rope at eye height',cue:'Pull to your forehead, thumbs going back.',an:'face_pull',kg:2.5,lo:15,hi:15},
  leg_press:{n:'Leg press',eq:'Machine',cue:'Stop before your lower back lifts off the pad. Feet mid-platform.',an:'leg_press',kg:5},
  leg_curl:{n:'Seated leg curl',eq:'Machine',cue:'Slow on the way back: 2–3 seconds.',an:'leg_curl',kg:2.5},
  goblet:{n:'Goblet squat to box',eq:'Dumbbell + box',cue:'Sit back to touch the box, chest tall, then stand.',an:'goblet',kg:2,lo:10,hi:10},
  pallof:{n:'Pallof press',eq:'Cable at chest height',cue:'Resist the twist. Keep breathing normally.',an:'pallof',kg:2.5,lo:10,hi:10,side:1},
  calf:{n:'Calf raise',eq:'Machine or step',cue:'Full stretch at the bottom, pause at the top.',an:'calf',kg:5,lo:15,hi:15},
  abduct:{n:'Hip abduction',eq:'Machine',cue:'Controlled, no bouncing.',an:'abduct',kg:2.5,lo:15,hi:15},
  pulldown_n:{n:'Neutral-grip pulldown',eq:'Cable, V-handle (or assisted pull-up)',cue:'Full stretch at the top, elbows to your ribs.',an:'pulldown_n',kg:2.5},
  incline_db:{n:'Incline dumbbell press',eq:'Dumbbells, bench at 30°',cue:'Lower to chest level. Breathe out as you press.',an:'incline_db',kg:1},
  cable_row:{n:'Seated cable row',eq:'Cable, V-handle',cue:'Sit tall. Pull with your elbows, not your back.',an:'cable_row',kg:2.5,lo:10,hi:12},
  lat_raise:{n:'Lateral raise',eq:'Dumbbells',cue:'Light weight. Lift to shoulder height, no higher.',an:'lat_raise',kg:1,lo:12,hi:15},
  curl:{n:'Biceps curl',eq:'Dumbbells',cue:'No swinging. Elbows stay still.',an:'curl',kg:1,lo:12,hi:12},
  rear_fly:{n:'Rear delt fly',eq:'Reverse pec-deck machine',cue:'Arms wide, squeeze your shoulder blades.',an:'rear_fly',kg:2.5,lo:15,hi:15},
  hip_thrust:{n:'Hip thrust',eq:'Machine, or barbell + bench',cue:'Chin tucked, ribs down. Squeeze 1 s at the top.',an:'hip_thrust',kg:5},
  leg_ext:{n:'Leg extension',eq:'Machine',cue:'Pause 1 s at the top.',an:'leg_ext',kg:2.5},
  hinge:{n:'Romanian deadlift',eq:'Light dumbbells',cue:'Push your hips back, flat back, stop at mid-shin.',an:'hinge',kg:1,lo:10,hi:10},
  dead_bug:{n:'Dead bug',eq:'Floor mat',cue:'Lower back pressed to the floor. Breathe out as you extend.',an:'dead_bug',kg:null,lo:6,hi:6,side:1},
  step_up:{n:'Step-up',eq:'Low box + dumbbells',cue:'Drive through the front heel. Box at knee height or lower.',an:'step_up',kg:1,lo:10,hi:10,side:1},
  side_plank:{n:'Side plank',eq:'Floor mat',cue:'Hips high. Keep breathing, never hold your breath.',an:'side_plank',kg:null,secs:30,side:1}
};
function phase(w){
  const n = w<=4?1:w<=8?2:3, light = (w===4||w===8);
  const P = {1:{name:'Foundation',lo:10,hi:12,rir:'3',rest:75,fin:8,z2:30},
             2:{name:'Build',lo:8,hi:12,rir:'2',rest:90,fin:10,z2:35},
             3:{name:'Push',lo:6,hi:10,rir:'1–2',rest:90,fin:12,z2:40}}[n];
  let a = n===1?(w<=2?2:3):n===2?3:4, b = n===1?(w<=2?2:3):3, c = 2;
  if(light){a=2;b=2;c=1}
  if(w===12) a=3;
  return Object.assign({n,light,retest:w===12,aSets:a,bSets:b,cSets:c},P);
}
function ex(id, wk){
  const e = Object.assign({id}, EX[id]);
  if(id==='hinge' && wk<=4){ e.n='Cable pull-through'; e.eq='Cable, rope on the low pulley'; e.kg=2.5; e.cue='Push your hips back, flat back, then squeeze your glutes to stand.'; }
  if(id==='side_plank' && wk<=4){ e.secs=20; e.eq='Floor mat, knees bent'; }
  return e;
}
function target(id, wid, wk){
  const e = ex(id,wk), ph = phase(wk);
  if(e.secs) return {secs:e.secs, side:e.side};
  if(W[wid].A && W[wid].A.includes(id)) return {lo:ph.lo, hi:ph.hi};
  return {lo:e.lo, hi:e.hi, side:e.side};
}
function tStr(t){ if(t.secs) return t.secs+' s'+(t.side?' / side':''); return (t.lo===t.hi?t.lo:t.lo+'–'+t.hi)+(t.side?' / side':''); }
function timerStep(key, title, secs, an, extra){ return Object.assign({kind:'timer',key,title,secs,an},extra||{}); }
function buildSteps(wid, wk){
  const w = W[wid], ph = phase(wk), st = [];
  if(w.cardio){
    st.push(timerStep('z2','Zone 2 cardio',ph.z2*60,'walk',{bpm:1,notes:['Elliptical or incline walk','Keep 122–140 bpm on your Watch','You can talk in sentences, but not sing']}));
    st.push(timerStep('core','Core finisher',300,'bird_dog',{notes:['Bird dog: 6 per side','Dead bug: 6 per side','Side plank: 20–30 s per side']}));
    return st;
  }
  st.push(timerStep('warm','Warm-up',300,'bike',{notes:['3 min easy bike or elliptical','Bird dog: 5 per side','Dead bug: 5 per side','10 glute bridges']}));
  // straight sets: finish every set of one exercise before moving to the next machine
  const block = (ids, sets, rest, g) => {
    ids.forEach((id,i)=>{ for(let s=1;s<=sets;s++) st.push({kind:'set',ex:id,set:s,sets,label:g+(i+1),rest}); });
  };
  block(w.A, ph.aSets, ph.rest, 'A');
  block(w.B, ph.bSets, ph.n===1?60:75, 'B');
  block(w.C, ph.cSets, 45, 'C');
  st[st.length-1].rest = 30;
  st.push(timerStep('fin','Zone 2 finisher',ph.fin*60,'walk',{bpm:1,notes:['Elliptical or incline walk','122–140 bpm on your Watch','Steady pace, nose breathing if you can']}));
  return st;
}
function plannedSets(wk){ return LIFTS.reduce((n,id)=>n+buildSteps(id,wk).filter(s=>s.kind==='set').length,0); }
function estMin(wid, wk){
  const st = buildSteps(wid,wk); let s = 0;
  st.forEach(x=>{ s += x.kind==='timer'? x.secs : 45 + (x.rest||0); });

function sheetHtml(){

/* ---------------- player ---------------- */
function startPlayer(wid, resume){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  if(resume){ S.pl = Object.assign(resume, {steps: buildSteps(resume.wid, resume.wk), confirm:false}); }
  else S.pl = { wid, wk:S.week, steps:buildSteps(wid,S.week), i:0, logs:[], startTs:Date.now(), mode:'work', confirm:false, sid: 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6) };
  S.sheet = null; enterStep(true); keepAwake(true); render();
}
function persistLive(){ const p=S.pl; if(!p||p.mode==='done'){ lsSet('lgp.live',null); return; } const c=Object.assign({},p); delete c.steps; lsSet('lgp.live',c); }
function enterStep(keep){
  const p = S.pl, s = p.steps[p.i];
  if(!s){ p.mode='done'; persistLive(); return; }
  if(keep && p.inp && p.inp.i===p.i && p.mode!=='rest') return;
  p.mode = 'work';
  if(s.kind==='timer' || target(s.ex,p.wid,p.wk).secs){
    const secs = s.kind==='timer'? s.secs : target(s.ex,p.wid,p.wk).secs*(target(s.ex,p.wid,p.wk).side?2:1);
    p.tm = {total:secs*1000, rem:secs*1000, end:null, half:false, done:false};
  } else p.tm = null;
  if(s.kind==='set'){
    const e = ex(s.ex,p.wk), t = target(s.ex,p.wid,p.wk), adv = advice(s.ex,p.wid,p.wk);
    const prev = p.logs.filter(r=>r.ex===s.ex).slice(-1)[0];
    p.inp = {i:p.i, kg: prev? prev.kg : (e.kg? adv.kg||0 : null), reps: prev? prev.reps : (t.lo||0)};
  } else p.inp = {i:p.i};
  persistLive();
}
function logCurrent(){
  const p = S.pl, s = p.steps[p.i];
  if(s.kind==='set'){
    const t = target(s.ex,p.wid,p.wk);
    if(t.secs){ const el = Math.round((p.tm.total - currentRem())/1000); p.logs.push({ex:s.ex,set:s.set,secs: Math.max(0, Math.round(el/(t.side?2:1)))}); }
    else p.logs.push({ex:s.ex,set:s.set,kg:p.inp.kg,reps:p.inp.reps});
  } else {
    const el = Math.round((p.tm.total - currentRem())/1000);
    p.logs.push({timer:s.key, secs:el, bpm:!!s.bpm});
  }
}
function currentRem(){ const tm=S.pl.tm; if(!tm) return 0; return tm.end? Math.max(0, tm.end-Date.now()) : tm.rem; }
function next(){
  const p = S.pl, s = p.steps[p.i];
  logCurrent();
  const rest = s.kind==='set' ? s.rest : 0;
  p.i++;
  if(p.i>=p.steps.length){ p.mode='done'; persistLive(); render(); return; }
  if(rest>0){ p.mode='rest'; p.restTotal=rest*1000; p.restEnd=Date.now()+rest*1000; persistLive(); render(); return; }
  enterStep(); render();
}
function skipStep(){ const p=S.pl; p.i++; p.mode='work'; if(p.i>=p.steps.length){ p.mode='done'; } else enterStep(); persistLive(); render(); }
function sessionFromPlayer(complete){
  const p = S.pl;
  const sets = p.logs.filter(r=>r.ex);
  const z2 = Math.round(p.logs.filter(r=>r.timer && r.bpm).reduce((n,r)=>n+r.secs,0)/60);
  return { sid:p.sid, wid:p.wid, week:p.wk, date:new Date(p.startTs).toISOString(), dur: Math.round((Date.now()-p.startTs)/1000), sets, z2min:z2, complete: !!complete };
}
async function finish(complete){
  const p = S.pl; if(S.saving) return;
  S.saving = true;
  const s = sessionFromPlayer(complete);
  const synced = await saveSession(s);
  S.saving = false; p.saved = true; p.synced = synced; p.mode = 'done'; p.final = s;
  lsSet('lgp.live', null); render();
}
function closePlayer(){ S.pl=null; lsSet('lgp.live',null); keepAwake(false); render(); }
function ring(frac, color, big, label){
  const r=46, c=2*Math.PI*r;
  return '<div class="ringwrap"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--card2)" stroke-width="7"/><circle id="rg" cx="50" cy="50" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-frac))+'"/></svg>'+
    '<div class="mid"><div class="t num" id="rt">'+big+'</div><div class="l">'+label+'</div></div></div>';
}

    else nInfo='<div class="next"><canvas data-an="'+nx.an+'" data-c="'+col+'"></canvas><div><div class="muted small">Up next</div><div style="font-weight:700">'+esc(nx.title)+'</div></div></div>';

function tick(){
  const p = S.pl;
  if(p){
    const el = $('#el'); if(el) el.textContent = mmss(Date.now()-p.startTs);
    if(p.mode==='rest'){
      const rem = p.restEnd-Date.now();
      if(rem<=0){ beep(2); enterStep(); render(); }
      else { setRing(rem/p.restTotal, mmss(rem)); if(rem<3200 && !p.warned){ p.warned=true; beep(1); } }
    } else if(p.mode==='work' && p.tm && p.tm.end){
      const rem = p.tm.end-Date.now(), s = p.steps[p.i], t = s.kind==='set'?target(s.ex,p.wid,p.wk):{};
      if(t.side && !p.tm.half && rem<=p.tm.total/2){ p.tm.half=true; beep(1); render(); return; }
      if(rem<=0){ p.tm.end=null; p.tm.rem=0; p.tm.done=true; beep(2); render(); }
      else setRing(rem/p.tm.total, mmss(rem));
    }
    if(p.mode!=='rest') p.warned=false;
  }
}
function setRing(f, txt){ const r=$('#rg'), t=$('#rt'); if(r){ const c=2*Math.PI*46; r.setAttribute('stroke-dashoffset', c*(1-f)); } if(t) t.textContent=txt; }
setInterval(tick, 250);

/* ---------------- render & events ---------------- */
function render(){
  const app = $('#app');
  if(S.pl){ app.innerHTML = playerHtml(); return; }
  let h = S.tab==='today'? viewToday() : S.tab==='history'? viewHistory() : viewGuide();
  h += tabsHtml();
  if(S.sheet) h += sheetHtml();
  app.innerHTML = h;
}
document.addEventListener('click', ev=>{
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, p = S.pl;
  switch(a){
    case 'tab': S.tab=b.dataset.t; S.sheet=null; render(); scrollTo(0,0); break;
    case 'wk': S.week=Math.min(12,Math.max(1,S.week+ +b.dataset.d)); render(); break;
    case 'sheet': S.sheet=b.dataset.w; render(); break;
    case 'close-sheet': S.sheet=null; render(); break;
    case 'start': startPlayer(b.dataset.w); break;
    case 'resume': { const l=lsGet('lgp.live'); if(l) startPlayer(l.wid, l); break; }
    case 'hist': S.open[b.dataset.sid]=!S.open[b.dataset.sid]; render(); break;
    case 'adj': { const f=b.dataset.f, d=+b.dataset.d, e=ex(p.steps[p.i].ex,p.wk);
      if(f==='kg') p.inp.kg = Math.max(0, Math.round(((p.inp.kg||0)+d*e.kg)*10)/10); else p.inp.reps=Math.max(0,p.inp.reps+d);
      persistLive(); render(); break; }
    case 'tm': { const tm=p.tm; if(tm.end){ tm.rem=Math.max(0,tm.end-Date.now()); tm.end=null; } else if(tm.rem>0){ tm.end=Date.now()+tm.rem; } persistLive(); render(); break; }
    case 'next': next(); break;
    case 'skip': skipStep(); break;
    case 'skip-rest': enterStep(); render(); break;
    case 'rest': p.restEnd += (+b.dataset.d)*1000; p.restTotal = Math.max(p.restTotal, p.restEnd-Date.now()); if(p.restEnd<=Date.now()) { enterStep(); } render(); break;
    case 'exit': if(p.mode==='done'){ closePlayer(); } else { p.confirm=true; render(); } break;
    case 'end-cancel': p.confirm=false; render(); break;
    case 'end-discard': closePlayer(); break;
    case 'end-save': p.confirm=false; finish(false); break;
    case 'save': finish(true); break;
    case 'close-pl': S.tab='today'; closePlayer(); break;
    case 'export': { const blob=new Blob([JSON.stringify(allSessions(),null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='gym-log-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); break; }
  }
});
render();
initDb();
})();
</script>
